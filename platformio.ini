; ESP32-C3 Super Mini + 2x 1.28" round GC9A01 (240x240) - Uncanny Eyes
; Derived from dalori/ESP32-uncanny-eyes-halloween-skull (TFT_eSPI -> LovyanGFX).
; All pins are configured in include/config.h - no library files need editing.

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Eye asset tables (~580 KB flash) need a large app partition, no OTA.
board_build.partitions = no_ota.csv

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I data/eyes

lib_deps =
  lovyan03/LovyanGFX@1.2.21
